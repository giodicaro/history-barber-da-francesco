# Promemoria ai clienti dell'app (24 ore e 2 ore prima dell'appuntamento).
# Il piano gratuito di Vercel permette cron solo una volta al giorno: questo
# workflow chiama la rotta del sito ogni 15 minuti. Non serve configurare
# niente: l'indirizzo del sito è qui sotto.
#
# Facoltativo:
#   - variabile APP_URL (Settings → Secrets and variables → Actions →
#     Variables) se il sito cambia dominio;
#   - segreto CRON_SECRET, con lo stesso valore della variabile CRON_SECRET
#     su Vercel, per chiudere la rotta a chi non ha la chiave.
#
# GitHub sospende i workflow pianificati di un repository pubblico dopo 60
# giorni senza commit: il passo "Resta attivo" lo riattiva da sé ogni giorno,
# con il token del workflow e senza azioni di terze parti.
name: Promemoria app

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: promemoria-app
  cancel-in-progress: false

jobs:
  promemoria:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invia i promemoria dovuti
        env:
          APP_URL: ${{ vars.APP_URL || 'https://history-barber-da-francesco.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          # Due tentativi: una funzione serverless "fredda" può rispondere lenta.
          for tentativo in 1 2; do
            if curl --fail-with-body --silent --show-error --max-time 60 "${auth[@]}" "$APP_URL/app/api/cron/promemoria"; then
              echo; exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Resta attivo (contro la sospensione dopo 60 giorni)
        # Una volta al giorno basta.
        if: github.event_name == 'schedule' && github.run_number % 96 == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/promemoria-app.yml/enable"
